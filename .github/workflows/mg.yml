name: Build DesktopGlues for Android

on:
  push:
  workflow_dispatch:

env:
  date_today: $(date +'%Y-%m-%d')
  repository_name: DesktopGlues-plugin
  LTO_LEVEL: 2
  USE_EXTRA_OPTIMIZATIONS: ON

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;27.3.13750724"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> local.properties

      - name: Clone submodule dependencies
        run: |
          cd DesktopGlues/MobileGlues-cpp
          git clone --depth 1 https://github.com/g-truc/glm.git 3rdparty/glm
          git clone --depth 1 https://github.com/stbrumme/xxhash.git 3rdparty/xxhash
          git clone --depth 1 https://android.googlesource.com/platform/external/perfetto 3rdparty/perfetto
          git clone --depth 1 https://github.com/MobileGL-Dev/FastSTL.git include/FastSTL
          git clone --depth 1 https://github.com/KhronosGroup/glslang.git 3rdparty/glslang
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git 3rdparty/SPIRV-Cross

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > ./keystore.jks
          chmod 600 ./keystore.jks

      - name: Inject build settings into submodule build.gradle
        run: |
          cd DesktopGlues
          sed -i '/ndkVersion = "27.3.13750724"/a \
              ndk { \
                  abiFilters.add("arm64-v8a") \
              } \
              externalNativeBuild { \
                  cmake { \
                      arguments.add("-DUSE_EXTRA_OPTIMIZATIONS=" + (System.getenv("USE_EXTRA_OPTIMIZATIONS") ?: "ON")) \
                      val ltoLevel = System.getenv("LTO_LEVEL")?.toIntOrNull() ?: 0 \
                      val ltoFlag = when(ltoLevel) { 2 -> "-flto" 1 -> "-flto=thin" else -> "" } \
                      arguments.add("-DLTO_FLAG=" + ltoFlag) \
                  } \
              }' build.gradle.kts

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build apk
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          LTO_LEVEL: ${{ env.LTO_LEVEL }}
          USE_EXTRA_OPTIMIZATIONS: ${{ env.USE_EXTRA_OPTIMIZATIONS }}
          
      - name: Clean up keystore
        if: always()
        run: rm -f ./keystore.jks

      - name: Upload apk
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.repository_name }}_${{ env.date_today }}_${{ github.sha }}
          path: app/build/outputs/apk/release/